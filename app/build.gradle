apply plugin: 'com.android.application'
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.parcelize"
apply plugin: "org.jetbrains.kotlin.kapt"
apply plugin: "com.jaredsburrows.license"

// ---------------------------------------------------------------------------
// 签名配置
//
// 背景：这个工程原本 <b>完全没有</b> signingConfigs，`assembleRelease` 产出的是
// app-release-unsigned.apk，装上必然「解析包错误」；而 CI 里用的 jarsigner 只产生
// v1(JAR) 签名，Android 11+ 对 targetSdk >= 30 的应用强制要求 v2 及以上，会被判定成
// 「安装包没有签名 / packageInfo is none」。
//
// 现在统一交给 AGP 的 signingConfig（底层就是 apksigner），显式开 v1+v2+v3：
//   v1  -> Android 6.0 (API 23) 需要，因为 v2 是 API 24 才引入
//   v2+ -> Android 11+ 强制要求
//
// 密钥来源优先级：环境变量 > keystore.properties > 无（退化为未签名构建，仅用于本地调试）
// ---------------------------------------------------------------------------
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def signingStoreFile = System.getenv("EHVIEWER_KEYSTORE_FILE") ?: keystoreProps.getProperty("storeFile")
def signingStorePassword = System.getenv("EHVIEWER_KEYSTORE_PASSWORD") ?: keystoreProps.getProperty("storePassword")
def signingKeyAlias = System.getenv("EHVIEWER_KEY_ALIAS") ?: keystoreProps.getProperty("keyAlias")
def signingKeyPassword = System.getenv("EHVIEWER_KEY_PASSWORD") ?: keystoreProps.getProperty("keyPassword")
def hasSigningConfig = signingStoreFile && signingStorePassword && signingKeyAlias

android {
    namespace 'com.hippo.ehviewer'
    testNamespace 'com.hippo.ehviewer.debug'
    compileSdk 35
//    buildToolsVersion "30.0.3"
    // 钉死 NDK 版本：不写这行时 AGP 会用它自己的默认版本
    // （AGP 9.3.1 默认要 28.2.13676358），换台机器就报 "NDK not configured"。
    // 用 r27 是因为本机已安装且 CMake 侧无版本相关 API。
    ndkVersion "27.0.12077973"

    // 只有真的拿到密钥才声明 signingConfig，避免留下一个空配置让 AGP 校验失败
    if (hasSigningConfig) {
        signingConfigs {
            release {
                storeFile rootProject.file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword ?: signingStorePassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    flavorDimensions "distribute"
    productFlavors {
        appRelease {
            dimension "distribute"
        }
//        googlePlay {
//            dimension "distribute"
//        }
    }

    defaultConfig {
        applicationId "com.ecv.customview"
        minSdkVersion 23
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 30
        versionCode 111
        versionName "2.0.2.7"
        vectorDrawables.useSupportLibrary = true
        resourceConfigurations += ['zh', 'zh-rCN', 'zh-rHK', 'zh-rTW', 'es', 'ja', 'ko', 'fr', 'de', 'th']
        testOptions.unitTests.includeAndroidResources = true
        multiDexEnabled true
        ndk {
            moduleName "native-lib"
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
        externalNativeBuild {
            cmake {
//                path 'src/main/cpp/CMakeLists.txt'
                cppFlags ''
            }
        }
    }

    lint {
        disable 'MissingTranslation'
        abortOnError true
        checkReleaseBuilds true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'String', 'FILE_PROVIDER_AUTHORITY', '"com.ecv.customview.fileprovider"'
            // 没配密钥时保持未签名（仅供本地调试）；正式出包必须配 keystore.properties，
            // 否则产物是 app-release-unsigned.apk，装了会报「解析包错误」。
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug1"
            buildConfigField 'String', 'FILE_PROVIDER_AUTHORITY', '"com.ecv.customview.debug1.fileprovider"'
        }
    }

    externalNativeBuild {
        cmake {
//            version '3.30.5'
            path file('src/main/cpp/CMakeLists.txt')
        }
    }
//    sourceSets {
//        main {
//            java.srcDirs += 'src/main/java-gen'
//        }
//    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }

    buildFeatures {
        viewBinding true
        buildConfig = true
    }

}

